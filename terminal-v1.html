<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tesfamichael Aboset</title>
<meta name="description" content="Tesfamichael Aboset — Senior DevOps Engineer in Addis Ababa. Builder of usend.et and kcdk.et.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0f14;
    --panel: #0f151c;
    --bar: #161d26;
    --border: #232c38;
    --fg: #c9d4e0;
    --dim: #6b7b8c;
    --green: #7ee787;
    --blue: #79c0ff;
    --yellow: #e3b341;
    --purple: #d2a8ff;
    --red: #ff7b72;
    --cyan: #56d4dd;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: 14px;
    line-height: 1.6;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .window {
    width: 100%;
    max-width: 980px;
    height: min(88vh, 820px);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .titlebar {
    background: var(--bar);
    border-bottom: 1px solid var(--border);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .titlebar .title { flex: 1; text-align: center; color: var(--dim); font-size: 12px; margin-right: 52px; }
  .chips {
    display: flex; gap: 6px; flex-wrap: wrap;
    padding: 10px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .chip {
    font: inherit; font-size: 12px; color: var(--dim);
    background: transparent; border: 1px solid var(--border); border-radius: 4px;
    padding: 4px 10px; cursor: pointer; min-height: 32px;
  }
  .chip:hover, .chip:focus-visible { color: var(--green); border-color: var(--green); outline: none; }
  #term {
    flex: 1; overflow-y: auto; padding: 16px 18px 24px;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  .line { white-space: pre-wrap; word-break: break-word; }
  .ascii { color: var(--green); font-size: clamp(5px, 1.35vw, 12px); line-height: 1.15; white-space: pre; overflow-x: hidden; }
  .prompt-row { display: flex; align-items: center; gap: 8px; }
  .ps1 { white-space: nowrap; }
  .u { color: var(--green); font-weight: 600; } .h { color: var(--blue); } .p { color: var(--purple); }
  .g { color: var(--green); } .b { color: var(--blue); } .y { color: var(--yellow); }
  .pu { color: var(--purple); } .r { color: var(--red); } .c { color: var(--cyan); } .d { color: var(--dim); }
  .bold { font-weight: 700; }
  a { color: var(--blue); text-decoration: none; border-bottom: 1px dashed currentColor; }
  a:hover { color: var(--green); }
  #input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--fg); font: inherit; caret-color: var(--green); min-width: 0;
  }
  .block { margin: 4px 0 14px; }
  .job { margin-bottom: 12px; padding-left: 14px; border-left: 2px solid var(--border); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 2px 16px; }
  .project { border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; margin-bottom: 10px; }
  .bar-wrap { display: inline-block; width: 140px; color: var(--dim); }
  @media (max-width: 600px) {
    body { padding: 0; font-size: 13px; }
    .window { height: 100vh; border-radius: 0; border: none; }
    #term { padding: 12px 16px 20px; }
    .titlebar .title { margin-right: 0; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div class="window">
  <div class="titlebar">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <span class="title">tesfamichael@addis: ~</span>
  </div>
  <nav class="chips" aria-label="Quick commands">
    <button class="chip" data-cmd="about">about</button>
    <button class="chip" data-cmd="experience">experience</button>
    <button class="chip" data-cmd="projects">projects</button>
    <button class="chip" data-cmd="skills">skills</button>
    <button class="chip" data-cmd="certs">certs</button>
    <button class="chip" data-cmd="education">education</button>
    <button class="chip" data-cmd="contact">contact</button>
    <button class="chip" data-cmd="help">help</button>
  </nav>
  <div id="term" role="log" aria-live="polite">
    <div id="out"></div>
    <div class="prompt-row">
      <label for="input" class="ps1"><span class="u">guest</span><span class="d">@</span><span class="h">tesfamichael</span><span class="d">:</span><span class="p">~</span><span class="d">$</span></label>
      <input id="input" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Terminal command">
    </div>
  </div>
</div>

<script>
const out = document.getElementById('out');
const input = document.getElementById('input');
const term = document.getElementById('term');
const history = [];
let hIdx = 0;

const BANNER = String.raw`
 _____         __                 _      _                _
|_   _|__  ___/ _| __ _ _ __ ___ (_) ___| |__   __ _  ___| |
  | |/ _ \/ __| |_ / _' | '_ ' _ \| |/ __| '_ \ / _' |/ _ \ |
  | |  __/\__ \  _| (_| | | | | | | | (__| | | | (_| |  __/ |
  |_|\___||___/_|  \__,_|_| |_| |_|_|\___|_| |_|\__,_|\___|_|
`;

const cmds = {
  help: () => `
<span class="bold">Available commands</span>
  <span class="g">about</span>        who I am
  <span class="g">experience</span>   where I've worked
  <span class="g">projects</span>     things I've built (usend.et, kcdk.et)
  <span class="g">skills</span>       tools &amp; tech I use daily
  <span class="g">certs</span>        licenses &amp; certifications
  <span class="g">education</span>    academic background
  <span class="g">contact</span>      how to reach me
  <span class="g">whoami</span>       short version
  <span class="g">neofetch</span>     system info, but it's me
  <span class="g">history</span>      commands you've run
  <span class="g">clear</span>        clear the screen

<span class="d">Tip: Tab autocompletes, ↑/↓ cycles history.</span>`,

  whoami: () => `<span class="g">Tesfamichael Aboset</span> — Senior DevOps Engineer · Addis Ababa, Ethiopia 🇪🇹`,

  about: () => `
<span class="y bold"># about.md</span>

I'm a <span class="g">Senior DevOps Engineer</span> based in Addis Ababa, Ethiopia.

I work across <span class="c">Docker, Kubernetes, Docker Compose, Azure, GitLab, AKS and RKE2</span>,
and I have a track record of improving cloud infrastructure automation and
CI/CD pipelines — cutting operational costs and raising system reliability.

I like cross-functional work and keep improving how teams ship.
Outside the day job I build my own products:
  → <a href="https://usend.et" target="_blank" rel="noopener">usend.et</a>  an email API for developers
  → <a href="https://kcdk.et" target="_blank" rel="noopener">kcdk.et</a>   every stack, every script, one console

<span class="d">Run</span> <span class="g">projects</span> <span class="d">to see more.</span>`,

  experience: () => {
    const jobs = [
      ['Senior DevOps Engineer', 'Technolab Interactive PLC', 'Oct 2025 — Present', 'Addis Ababa', null],
      ['DevOps Engineer', 'Kifiya Financial Technology PLC', 'Jan 2025 — Nov 2025', 'Addis Ababa',
        'Designed and managed CI/CD pipelines with Jenkins, GitHub Actions and GitLab, reducing deployment times and ensuring smooth rollouts.'],
      ['DevOps Engineer', 'Ablaze Labs', 'Feb 2024 — Jan 2025', 'Addis Ababa · Hybrid',
        'Built and optimized CI/CD pipelines with Azure DevOps, cutting deployment failures by <span class="g">60%</span> and release cycles from <span class="g">2 days to 3 hours</span>.'],
      ['DevOps Engineer', 'Addispay Financial Technology S.C', 'Dec 2023 — Sep 2024', 'Addis Ababa · Hybrid',
        'Deployed and managed Rancher RKE2 clusters for high availability and reliability.'],
      ['System Administrator & Support Engineer', 'Hirundo AB Telecommunication VAS', 'Jun 2022 — Nov 2023', 'Addis Ababa · Hybrid',
        'Configured and maintained enterprise-grade servers.'],
    ];
    return `<span class="y bold"># experience</span>\n\n` + jobs.map(([t, c, d, l, desc]) =>
      `<div class="job"><span class="g bold">${t}</span> <span class="d">@</span> <span class="b">${c}</span>
<span class="d">${d} · ${l}</span>${desc ? `\n${desc}` : ''}</div>`).join('');
  },

  projects: () => `
<span class="y bold"># projects</span>

<div class="project"><span class="g bold">uSend</span>  <a href="https://usend.et" target="_blank" rel="noopener">usend.et</a>
<span class="pu">"Email that just works."</span> — the email API for developers.

  • REST sending with batches, scheduling &amp; idempotency keys
  • Inbound email via a single MX record, routed back to your app
  • Real-time delivery / bounce / open events as signed webhooks
  • One-click DNS (DKIM, SPF, DMARC) incl. Cloudflare auto-configure
  • Templates, broadcasts, automatic bounce &amp; complaint suppression
  • Local pricing in ETB via Telebirr, or USD

<span class="d">stack:</span> <span class="c">REST API · SMTP · Amazon SES · Standard Webhooks · SDKs: @usend/node, usend (pip)</span></div>
<div class="project"><span class="g bold">KCDK</span>  <a href="https://kcdk.et" target="_blank" rel="noopener">kcdk.et</a>
<span class="pu">"Every stack. Every script. One console."</span>

  • One console for running and managing scripts across any stack</div>`,

  skills: () => {
    const groups = {
      'Containers & Orchestration': ['Docker', 'Docker Compose', 'Kubernetes', 'AKS', 'Rancher RKE2'],
      'CI/CD': ['GitLab CI', 'GitHub Actions', 'Jenkins', 'Azure DevOps'],
      'Cloud': ['AWS', 'Amazon EC2', 'Amazon RDS', 'Amazon VPC', 'AWS CloudFormation', 'Amazon SES', 'Azure'],
      'IaC & Code': ['Terraform', 'Go', 'Bash'],
      'Systems': ['Linux', 'Networking', 'Troubleshooting', 'Build Automation'],
    };
    return `<span class="y bold"># skills</span> <span class="d">(top: Docker · Kubernetes · GitLab · Terraform · Go)</span>\n\n` +
      Object.entries(groups).map(([k, v]) =>
        `<span class="b">${k}</span>\n<div class="grid block">${v.map(s => `<span><span class="g">▸</span> ${s}</span>`).join('')}</div>`).join('');
  },

  certs: () => `
<span class="y bold"># certifications</span>

<span class="g">✔</span> <span class="bold">AWS Certified Solutions Architect — Associate</span>
  <span class="d">Amazon Web Services · issued Oct 2025 · expires Oct 2028</span>

<span class="g">✔</span> <span class="bold">AWS Certified Cloud Practitioner</span>
  <span class="d">Amazon Web Services · issued Jun 2025 · expires Jun 2028</span>

<span class="d">+ 10 more on</span> <a href="https://www.linkedin.com/in/tesfamichael-aboset/" target="_blank" rel="noopener">LinkedIn</a>`,

  education: () => `
<span class="y bold"># education</span>

<span class="g bold">Adigrat University</span>  <span class="d">2016 — 2021</span>
BSc, Electrical and Computer Engineering
<span class="d">Specialized in Computer Engineering</span>`,

  contact: () => `
<span class="y bold"># contact</span>

  <span class="b">linkedin</span>  <a href="https://www.linkedin.com/in/tesfamichael-aboset/" target="_blank" rel="noopener">linkedin.com/in/tesfamichael-aboset</a>
  <span class="b">location</span>  Addis Ababa, Ethiopia
  <span class="b">products</span>  <a href="https://usend.et" target="_blank" rel="noopener">usend.et</a> · <a href="https://kcdk.et" target="_blank" rel="noopener">kcdk.et</a>`,

  neofetch: () => `<div style="display:flex;gap:24px;flex-wrap:wrap"><pre class="g" style="line-height:1.2">     ▄▄▄▄▄▄▄
   ▄█▀▀   ▀▀█▄
  ██  ⎈  ☁  ██
  ██  ▣  ⚙  ██
   ▀█▄▄   ▄▄█▀
     ▀▀▀▀▀▀▀</pre><div><span class="g bold">tesfamichael</span>@<span class="b bold">addis</span>
<span class="d">-----------------</span>
<span class="b">OS</span>:        DevOps Engineer v5.0
<span class="b">Host</span>:      Technolab Interactive PLC
<span class="b">Uptime</span>:    4+ years in production
<span class="b">Shell</span>:     bash / go
<span class="b">Packages</span>:  68 skills, 12 certs
<span class="b">Cloud</span>:     AWS · Azure
<span class="b">Orch</span>:      Kubernetes · RKE2 · AKS
<span class="b">Ships</span>:     usend.et · kcdk.et
<span class="b">Locale</span>:    Addis Ababa, ET</div></div>`,

  history: () => history.map((h, i) => `  ${String(i + 1).padStart(3)}  ${escapeHtml(h)}`).join('\n') || '<span class="d">(empty)</span>',

  clear: () => { out.innerHTML = ''; return null; },

  sudo: () => `<span class="r">guest is not in the sudoers file. This incident will be reported.</span>`,
  ls: () => `<span class="b">about.md</span>  <span class="b">experience/</span>  <span class="b">projects/</span>  <span class="b">skills.yaml</span>  <span class="b">certs/</span>  <span class="b">contact.txt</span>`,
  kubectl: () => `NAME              READY   STATUS    RESTARTS   AGE
usend-api         1/1     <span class="g">Running</span>   0          ∞
kcdk-console      1/1     <span class="g">Running</span>   0          ∞
career            1/1     <span class="g">Running</span>   0          4y`,
};

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function print(html, cls = 'line') {
  const div = document.createElement('div');
  div.className = cls;
  div.innerHTML = html;
  out.appendChild(div);
}

function echoPrompt(cmd) {
  print(`<span class="u">guest</span><span class="d">@</span><span class="h">tesfamichael</span><span class="d">:</span><span class="p">~</span><span class="d">$</span> ${escapeHtml(cmd)}`);
}

function run(raw) {
  const cmd = raw.trim();
  echoPrompt(cmd);
  if (!cmd) return scrollEnd();
  history.push(cmd);
  hIdx = history.length;
  const name = cmd.split(/\s+/)[0].toLowerCase();
  const fn = cmds[name];
  if (fn) {
    const res = fn();
    if (res !== null) print(res.replace(/^\n/, ''), 'line block');
  } else {
    print(`<span class="r">command not found:</span> ${escapeHtml(name)}  <span class="d">— try</span> <span class="g">help</span>`, 'line block');
  }
  scrollEnd();
}

function scrollEnd() { term.scrollTop = term.scrollHeight; }

input.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    run(input.value);
    input.value = '';
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (hIdx > 0) input.value = history[--hIdx];
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    hIdx = Math.min(history.length, hIdx + 1);
    input.value = history[hIdx] || '';
  } else if (e.key === 'Tab') {
    e.preventDefault();
    const v = input.value.toLowerCase();
    const matches = Object.keys(cmds).filter(c => c.startsWith(v));
    if (matches.length === 1) input.value = matches[0];
    else if (matches.length > 1) { echoPrompt(input.value); print(matches.join('  '), 'line d block'); scrollEnd(); }
  } else if (e.key === 'l' && e.ctrlKey) {
    e.preventDefault();
    cmds.clear();
  }
});

document.querySelectorAll('.chip').forEach(b =>
  b.addEventListener('click', () => { run(b.dataset.cmd); input.focus({ preventScroll: true }); }));

term.addEventListener('click', () => {
  if (!window.getSelection().toString()) input.focus({ preventScroll: true });
});

// boot sequence
print(BANNER, 'ascii');
print(`<span class="g bold">Tesfamichael Aboset</span> <span class="d">—</span> Senior DevOps Engineer <span class="d">·</span> Addis Ababa, Ethiopia
<span class="d">Builder of</span> <a href="https://usend.et" target="_blank" rel="noopener">usend.et</a> <span class="d">&amp;</span> <a href="https://kcdk.et" target="_blank" rel="noopener">kcdk.et</a>

Type <span class="g">help</span> to see commands, or click one above.`, 'line block');
run('whoami');
input.focus();
</script>
</body>
</html>
